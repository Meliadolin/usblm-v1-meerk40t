name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-build.txt

      - name: Install build dependencies
        run: |
          pip install -r tools/requirements-build.txt
          pip install -r tools/requirements-runtime.txt

      - name: Build release package
        run: python tools/build_release.py

      - name: Run offline CI test (no board)
        run: python tests/ci_test.py

      - name: Build the pip plugin wheel
        run: pip wheel --no-deps -w wheelhouse_dist .

      - name: Zip the package
        shell: pwsh
        run: |
          Compress-Archive -Path "setup\*" -DestinationPath "usblm-v1-meerk40t-${{ github.ref_name }}.zip" -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            usblm-v1-meerk40t-*.zip
            wheelhouse_dist/*.whl
          generate_release_notes: true
